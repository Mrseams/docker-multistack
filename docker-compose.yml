services:
  # Angular SPA
  spa:
    build:
      context: ./angular/spa
      dockerfile: DockerFile
    container_name: spa
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api
    networks:
      - webnet

  # Angular SSR
  ssr:
    build:
      context: ./angular/ssr
      dockerfile: DockerFile
    container_name: ssr
    restart: unless-stopped
    ports:
      - "4000:4000"
    networks:
      - webnet

  # NestJS API
  api:
    build:
      context: ./nestjs/nestjs-api
      dockerfile: DockerFile
    container_name: nest-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - webnet

  # Express App
  express:
    build:
      context: ./express/express-app
      dockerfile: DockerFile
    container_name: express-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    networks:
      - webnet

  # Oracle Node API
  oracle-api:
    build:
      context: ./oracle-node-api/oracle-api
      dockerfile: DockerFile
    container_name: oracle-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks:
      - webnet
    environment:
      - NODE_ENV=production

  # NGINX Reverse Proxy
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - spa
      - ssr
      - api
      - oracle-api
      - express
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
